name: Buscar ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: ofertas-automaticas
  cancel-in-progress: true

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KEYWORDS: ssd,memoria ram,monitor gamer,fone bluetooth,roteador,teclado mecanico
      ML_KEYWORDS: celular,smart tv,notebook,ssd,memoria ram,monitor,fone bluetooth,roteador,power bank,ferramentas,casa,moda,eletrodomesticos
      MIN_DISCOUNT: 20
      MIN_RATING: 4.5
      MIN_SALES: 50
      MAX_OFFERS: 5
      ML_MIN_DISCOUNT: 0
      ML_MAX_OFFERS: 10
      ML_CATALOG_LIMIT: 5
      ML_ITEM_LIMIT: 10
      ML_PROMOTION_CHECKS_PER_PRODUCT: 2
      SUB_ID: telegram,ofertas,tech
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnosticar API do Mercado Livre
        run: node src/diagnose-mercadolivre.mjs
      - name: Descobrir candidatos no Mercado Livre
        run: node src/run-mercadolivre.mjs
      - name: Guardar relatório Mercado Livre
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-mercadolivre
          path: |
            ofertas-mercadolivre.md
            ofertas-mercadolivre.json
          if-no-files-found: error
          retention-days: 7
      - name: Buscar ofertas da Shopee
        run: node src/index.mjs
      - name: Guardar relatório Shopee
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-shopee
          path: |
            ofertas-shopee.md
            ofertas-shopee.json
          if-no-files-found: error
          retention-days: 7
