name: Buscar ofertas

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/telegram-sent.json'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ofertas-automaticas
  cancel-in-progress: true

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      ML_APP_ID: ${{ secrets.ML_APP_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
      AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
      AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
      AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
      AMAZON_VERSION: ${{ secrets.AMAZON_VERSION }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      AMAZON_TOKEN_URL: ${{ secrets.AMAZON_TOKEN_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      KEYWORDS: celular,smart tv,notebook,ssd,memoria ram,monitor gamer,fone bluetooth,fone gamer,teclado mecanico,mouse gamer,placa de video,roteador wifi 6,power bank,furadeira,parafusadeira,impressora,air fryer,cafeteira,aspirador
      ML_KEYWORDS: celular,smart tv,notebook,ssd,memoria ram,monitor,fone bluetooth,roteador wifi 6,power bank,furadeira,parafusadeira,impressora,tablet,smartwatch,mouse gamer,teclado mecanico,placa de video,headset gamer,air fryer,cafeteira,aspirador
      AMAZON_KEYWORDS: celular,smart tv,notebook,ssd,memoria ram,monitor gamer,fone bluetooth,roteador,power bank
      MIN_DISCOUNT: 1
      MIN_RATING: 0
      MIN_SALES: 0
      MIN_PRICE: 0
      MIN_SCORE: 0
      MIN_COMMISSION: 0
      MAX_OFFERS: 30
      SHOPEE_MAX_PER_KEYWORD: 2
      SHOPEE_MAX_PER_SHOP: 2
      ML_MIN_DISCOUNT: 1
      ML_MIN_PRICE: 0
      ML_MIN_SCORE: 0
      ML_MIN_SOLD: 0
      ML_MAX_PER_SELLER: 2
      ML_MAX_OFFERS: 10
      ML_SEARCH_LIMIT: 40
      ML_DETAIL_CHECKS: 12
      ML_CATALOG_LIMIT: 5
      ML_ITEM_LIMIT: 20
      ML_PROMOTION_CHECKS_PER_PRODUCT: 2
      ML_HIGHLIGHT_LIMIT: 20
      ML_MAX_CATEGORIES_PER_KEYWORD: 2
      ML_PROMOTION_CHECKS: 8
      AMAZON_MIN_DISCOUNT: 1
      AMAZON_MIN_PRICE: 0
      AMAZON_MIN_SCORE: 0
      AMAZON_MAX_OFFERS: 10
      AWIN_LINK_BUILDER_LIMIT: 5
      TELEGRAM_MAX_SEND: 5
      TELEGRAM_STATE_LIMIT: 2000
      TELEGRAM_STATE_TTL_DAYS: 14
      SUB_ID: telegram,ofertas,tech
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Renovar token do Mercado Livre automaticamente
        continue-on-error: true
        run: node src/refresh-mercadolivre-token.mjs
      - name: Diagnosticar API do Mercado Livre
        run: node src/diagnose-mercadolivre.mjs
      - name: Descobrir candidatos no Mercado Livre
        run: node src/run-mercadolivre.mjs
      - name: Buscar ofertas da Shopee
        run: node src/index.mjs
      - name: Buscar ofertas Amazon e Awin
        run: node src/run-amazon-awin.mjs
      - name: Enviar novas ofertas ao Telegram
        run: node src/publish-telegram.mjs
      - name: Guardar relatórios
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-ofertas
          path: |
            ofertas-mercadolivre.md
            ofertas-mercadolivre.json
            ofertas-shopee.md
            ofertas-shopee.json
            ofertas-amazon-awin.md
            ofertas-amazon-awin.json
          if-no-files-found: error
          retention-days: 7
