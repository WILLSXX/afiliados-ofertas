name: Buscar ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KEYWORDS: ssd,memoria ram,monitor gamer,fone bluetooth,roteador,teclado mecanico
      MIN_DISCOUNT: 20
      MIN_RATING: 4.5
      MIN_SALES: 50
      MAX_OFFERS: 5
      SUB_ID: telegram,ofertas,tech
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Executar motor de ofertas
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar ofertas
        run: node src/index.mjs
