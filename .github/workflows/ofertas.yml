name: Buscar ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KEYWORDS: ssd,memoria ram,monitor gamer,fone bluetooth,roteador,teclado mecanico
      ML_KEYWORDS: ssd,memoria ram,monitor gamer,fone bluetooth,roteador,teclado mecanico
      MIN_DISCOUNT: 20
      MIN_RATING: 4.5
      MIN_SALES: 50
      MAX_OFFERS: 5
      ML_MIN_DISCOUNT: 15
      ML_MAX_OFFERS: 10
      SUB_ID: telegram,ofertas,tech
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Descobrir candidatos no Mercado Livre
        run: node src/run-mercadolivre.mjs
      - name: Guardar relatório Mercado Livre
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-mercadolivre
          path: |
            ofertas-mercadolivre.md
            ofertas-mercadolivre.json
          if-no-files-found: error
      - name: Buscar ofertas da Shopee
        run: node src/index.mjs
